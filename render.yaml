services:
  - type: web
    name: ryadom-family-chat
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server-relay
    buildCommand: npm ci --omit=dev && node --check server.mjs && npm test
    startCommand: node server.mjs
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24.19.0"
